name: Build Ghostprint APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Extract Ghostprint
        run: |
          mkdir -p build-src
          unzip -q Ghostprint-Android-v0.3.1-IdentityGraph.zip -d build-src

      - name: Build Ghostprint APK
        working-directory: build-src/Ghostprint
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload Ghostprint APK
        uses: actions/upload-artifact@v4
        with:
          name: Ghostprint-APK
          path: build-src/Ghostprint/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
